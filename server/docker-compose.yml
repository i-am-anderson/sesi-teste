services:
  postgres:
    image: postgres:16
    container_name: sesiteste
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default

    ports:
      - "5434:5432"

    volumes:
      - sesiteste_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sesiteste_data:
